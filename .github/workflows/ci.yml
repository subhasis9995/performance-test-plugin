name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly full evaluation
permissions:
  contents: read
jobs:
  engine-and-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.7" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: uv sync --frozen
      - run: uv run perf setup --browser
      - name: L0 engine unit + integration
        run: uv run pytest engine/tests -q --junitxml=evals/reports/latest/l0.xml
      - name: SUT (native Juice Shop + fault proxy, no Docker)
        run: |
          python sut/juice-shop/install.py --install
          python sut/juice-shop/install.py --start --start-proxy
          python sut/juice-shop/install.py --health
      - name: L1 deterministic E2E
        run: uv run pytest evals/e2e -q --junitxml=evals/reports/latest/l1.xml
        env: { EVAL_KEEP_SUT: "1" }
      - name: Scorecard
        if: always()
        run: uv run python evals/scorecard.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "eval-reports-${{ matrix.os }}", path: evals/reports/latest }

  agent-evals:
    # L2/L3 make billed model calls; run nightly or on demand with an API key secret.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: sudo apt-get install -y bubblewrap socat
      - run: uv sync --frozen && uv run perf setup --browser
      - name: L2 claude plugin eval (mocked engine)
        run: claude plugin eval . --runs 3 --trust-plugin --no-publish --judge-model sonnet --max-cost-usd 15 --json evals/reports/latest/l2.json
      - name: SUT
        run: |
          python sut/juice-shop/install.py --install && python sut/juice-shop/install.py --start --start-proxy && python sut/juice-shop/install.py --health
      - name: L3 headless plugin journey (real engine + SUT)
        run: uv run pytest evals/headless -q --junitxml=evals/reports/latest/l3.xml
      - run: uv run python evals/scorecard.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: agent-eval-reports, path: evals/reports/latest }
