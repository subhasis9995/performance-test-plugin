[project]
name = "perfeng"
version = "0.1.0"
description = "Policy-gated performance engineering engine behind the `perf` Claude Code plugin"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "psutil>=6.0",
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "mcp>=1.20",
  "python-dotenv>=1.0",
  "markdown>=3.11.3",
]

[project.scripts]
perf = "perfeng.cli:app"
perfeng-mcp = "perfeng.mcp_server:main"
perfeng-worker = "perfeng.workers.entrypoint:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/perfeng"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
markers = [
  "live: needs running SUT (Juice Shop + fault proxy)",
  "agent: makes billed Claude model calls",
]

[tool.uv]
link-mode = "copy"  # plugin evals refuse hard-linked files inside the plugin tree
